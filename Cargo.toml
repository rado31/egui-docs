[package]
name = "egui-docs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An interactive, explained guide to egui"
repository = "https://github.com/rado31/egui-docs"

# Pinned to a single egui release on purpose: every lesson documents *this* API.
# On each egui release: bump all three, run `cargo check`, fix what broke, update lessons.
[dependencies]
egui = "=0.36.2"
# `default-features = false` only to keep the wgpu backend out — we render with
# glow. Everything else below is part of eframe's own default set and has to be
# listed back explicitly, or it is silently lost.
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",          # screen-reader support (native)
    "default_fonts",
    "glow",               # WebGL in the browser, OpenGL natively
    "links",              # without this, hyperlinks do nothing on native
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui_extras = "=0.36.2"

# Translations: one folder of Fluent files per language under `locales/`,
# embedded at compile time by `build.rs`. Fluent rather than format strings
# because Russian (like most languages) has more than two plural forms.
fluent-bundle = "0.16"
fluent-syntax = "0.12" # only to list a language's message ids, for the tests
unic-langid = "0.9"
# Picks the starting language from the OS, or from `navigator.language` on the
# web. `js` is what enables the web half; it is target-gated inside the crate.
sys-locale = { version = "0.3", features = ["js"] }
# Reports broken translation files. Already in the tree through egui.
log = "0.4"

# Web build only. eframe re-exports `wasm_bindgen` and `web_sys`, so only the
# async executor is needed here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

# Native build only: somewhere for egui's and eframe's `log` output to go. On
# the web `eframe::WebLogger` already routes it to the browser console.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# Lets the UI be rendered and inspected headlessly, without a window:
# `cargo test` renders each lesson to a PNG under `tests/snapshots/`.
[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }

# Web bundle size matters more here than compile time: this is a guide people
# load in a browser. `panic` is deliberately left unwinding so eframe's panic
# hook can still report a readable error in the console.
[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
strip = true

# Debug builds of the app itself stay fast to compile, but dependencies are
# optimized — an unoptimized egui is painfully slow to interact with.
[profile.dev.package."*"]
opt-level = 2
